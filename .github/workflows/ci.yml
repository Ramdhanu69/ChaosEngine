name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Verify (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage pytest

      - name: Run ChaosHarness Self-Test
        run: |
          python run.py selftest

      - name: Run Harness CI Smoke Test (Offline Replay Demo)
        run: |
          python run.py run --model mock-good --quick --seed 42 --cache replay --cache-dir ./demo_cache

      - name: Run Route Lookup
        run: |
          python run.py route --manifest out/demo/mock-good/routing_manifest.json --task code

      - name: Run Test Suite with Coverage
        run: |
          python -m coverage run --source=chaosharness -m pytest -v -m "not live_ollama"
          python -m coverage report

      - name: Build Wheel Package
        run: |
          python -m pip wheel --no-deps -w dist .
